name: test
on: [push, pull_request]
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        # 판정기 사례는 턴 동안의 파일 사건(macOS FSEvents)을 관찰해야 돌 수 있어 macOS 에서도 돌린다. Linux 에서는 미실행으로 표시된다.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 설치기 시험이 v3.0.0 태그에서 업그레이드 경로를 확인한다
      - run: bash tests/install.test.sh
      - run: bash evals/selftest.sh
